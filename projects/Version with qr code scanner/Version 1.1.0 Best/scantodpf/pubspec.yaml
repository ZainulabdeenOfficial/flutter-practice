name: scan2pdf
description: A Flutter app for scanning documents and converting them to PDF.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.2

  # State management
  provider: ^6.0.5

  # Camera and image handling
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.1.3
  mobile_scanner: ^3.5.6  # QR code scanning

  # PDF generation and handling
  pdf: ^3.10.4
  printing: ^5.11.0

 # secure
  crypto: ^3.0.3

  # File and storage management
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1

  # Sharing and external interactions
  share_plus: ^7.2.1

  # File picker
  file_picker: ^10.1.0

  # UI components
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
